[project]
site_name = "Materials Commons DSP Tiers"
repo_url = "https://github.com/MaterialsCommons/mc-dsp-tiers"
site_url = "https://materialscommons.github.io/mc-dsp-tiers/"
site_description = "Materials Commons tiered profiles of the Dataspace Protocol (DSP), DCAT-3 and DCAT-AP"
site_author = "Materials Commons Contributors"
edit_uri = "edit/main/docs/"
repo_name = "MaterialsCommons/mc-dsp-tiers"
copyright = 'Maintained by <a href="https://github.com/MaterialsCommons">Materials Commons</a>.'

extra_css = ["stylesheets/extra.css"]

nav = [
    { "Home" = "index.md" },
    { "DSP Tier 1" = "materials-commons-dsp-tier1.md" },
    { "DCAT-AP GET Protocol Tier 1" = "materials-commons-dcat-ap-get-protocol-tier-1.md" },
]

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.tabs",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "deep orange"
toggle.icon =  "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon =  "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MaterialsCommons/mc-dsp-tiers"

# ===========================================================================
# BEGIN Zensical defaults - restated, not project choices
#
# Zensical enables a set of Markdown extensions out of the box, but a project
# that declares ANY markdown_extensions REPLACES that set instead of extending
# it: zensical/config.py reads them via
#     config.get("markdown_extensions", DEFAULT_MARKDOWN_EXTENSIONS)
# which is a fallback, not a merge. Every default left out here is therefore
# silently switched off - that is how `!!! note` callouts ended up rendering as
# literal text before "admonition" was restored. The rule catalogue page depends
# on "pymdownx.details" the same way, for its collapsed "In context" prose.
#
# The entries below reproduce Zensical 0.0.46's defaults, so the effective set
# is visible in one file. Treat them as upstream values: re-check them against
# DEFAULT_MARKDOWN_EXTENSIONS whenever ZENSICAL_VERSION changes in the
# Makefile, and put anything this project actually chooses in the
# project-specific block that follows.
#
# Two exceptions to "verbatim", both called out where they occur:
#   - pymdownx.superfences and toc are customized, so they live in the
#     project-specific block below rather than here (TOML forbids defining the
#     same table twice).
#   - pymdownx.smartsymbols is a default this project deliberately turns off;
#     it stays here, commented out, with the reasoning next to it.
# ===========================================================================

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]

# Deliberately left disabled, though Zensical enables it by default:
# pymdownx.smartsymbols silently rewrites (c), (r), (tm), +/-, -->, <--, =/=
# and fractions such as 1/2 wherever they appear in prose. On a specification
# site those sequences are real content rather than typographic shorthand - it
# already turned the "(c)" of an (a)/(b)/(c) enumeration in use-cases.md into a
# copyright sign - and because the substitution happens silently the damage is
# easy to miss in review. The prettier glyphs are not worth that risk here.
# [project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# ===========================================================================
# END Zensical defaults
# ===========================================================================

# Project-specific extensions and overrides of the defaults above.

# Overrides the default superfences config, which declares the same mermaid
# fence but leaves "format" implicit.
[project.markdown_extensions.pymdownx.superfences]

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"

# Zensical defaults this to permalink = true as well; kept here because the
# docs depend on the anchor links rather than merely inheriting them.
[project.markdown_extensions.toc]
permalink = true

[project.extra.version]
provider = "mike"
